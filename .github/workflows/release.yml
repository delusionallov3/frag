# Pushing a version tag (git tag v0.4.1 && git push origin v0.4.1) builds the Windows installer and
# publishes the GitHub release with the three files the auto-updater reads:
# Frag-Setup-x.y.z.exe, its .blockmap and latest.yml. The release notes come from src/shared/changelog.ts.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $v" >&2
            exit 1
          fi

      - run: npm ci

      - run: npm run typecheck

      - name: Release notes from the changelog
        run: node scripts/release-notes.mjs > notes.md

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --win --publish always

      - name: Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --draft=false
